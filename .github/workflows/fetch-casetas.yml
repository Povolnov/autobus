name: Fetch Casetas sources
on:
  push:
    branches: [casetas-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ curl -sSL -A "$UA" --retry 3 -o "$1" "$2" || echo "FAIL $1" >> fails.txt; }
          get m603.json "https://www.ctaz.es/wp-json/wp/v2/media?search=603&per_page=50"
          get m613.json "https://www.ctaz.es/wp-json/wp/v2/media?search=613&per_page=50"
          get m619.json "https://www.ctaz.es/wp-json/wp/v2/media?search=619&per_page=50"
          get m611.json "https://www.ctaz.es/wp-json/wp/v2/media?search=611&per_page=50"
          get mpdf.json "https://www.ctaz.es/wp-json/wp/v2/media?mime_type=application/pdf&per_page=100"
          get tp.html "https://www.ctaz.es/servicios/transporte-publico-ctaz-2/"
          get casetero2.html "https://www.soydezaragoza.es/horarios-recorrido-casetero"
          get t619.html "https://www.ctaz.es/l619-l620-traslado-de-terminal-a-av-madrid-33-frente-a-aljaferia-desde-el-miercoles-28-de-octubre-por-obras-en-el-entorno-de-portillo/"
          get t619b.html "https://www.ctaz.es/l619-l620-las-lineas-zaragoza-la-joyosa-alagon-figueruelas-pedrola-trasladan-su-terminal-en-zaragoza-a-la-calle-marie-curie/"
          get moovit603.pdf "https://appassets.mvtdev.com/map/149/l/3201/351322.pdf"
          ls -la
      - name: Commit
        run: |
          mkdir -p casetas-src2 && cp -r out/* casetas-src2/
          git config user.name github-actions && git config user.email actions@github.com
          git add casetas-src2 && git commit -m "Casetas sources" && for i in 1 2 3; do git push && break; sleep 5; done
