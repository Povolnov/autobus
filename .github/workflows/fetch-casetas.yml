name: Fetch Casetas sources
on:
  push:
    branches: [casetas-data]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          get(){ curl -sSL -A "$UA" --retry 3 -o "$1" "$2" || echo "FAIL $1" >> fails.txt; }
          get t603.pdf "https://www.ctaz.es/wp-content/uploads/2026/05/C19_603-613_Triptico_TRZ_270526-1.pdf"
          get h603.png "https://www.ctaz.es/wp-content/uploads/2026/05/Horarios-L603-L613-1.png"
          get t619.pdf "https://www.ctaz.es/wp-content/uploads/2025/05/C19_619AB-620AB_Triptico_TRZ_260526-1.pdf"
          get h619.png "https://www.ctaz.es/wp-content/uploads/2026/05/Horarios-619-620.png"
          get v619_2508.pdf "https://www.ctaz.es/wp-content/uploads/2025/05/Zaragoza_C19_619AB-620AB_130825_V2.pdf"
          get obras619.jpg "https://www.ctaz.es/wp-content/uploads/2026/10/L619_620_OBRAS_202610.jpg"
          get obras619b.jpg "https://www.ctaz.es/wp-content/uploads/2026/10/L619_620_OBRAS_202610_2.jpg"
          get t611.pdf "https://www.ctaz.es/wp-content/uploads/2025/05/C19_611_Diptico_OK_280125.pdf"
          ls -la
      - name: Commit
        run: |
          mkdir -p casetas-src3 && cp -r out/* casetas-src3/
          git config user.name github-actions && git config user.email actions@github.com
          git add casetas-src3 && git commit -m "Casetas sources" && for i in 1 2 3; do git push && break; sleep 5; done
